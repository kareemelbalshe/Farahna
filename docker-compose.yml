# =============================================================================
# Farahna Platform — Production Docker Compose Orchestration
# =============================================================================
version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: farahna_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-farahna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-farahna_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-farahna_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-farahna} -d ${DB_NAME:-farahna_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farahna_network

  # 2. Express API Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: farahna_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${DB_USER:-farahna}:${DB_PASSWORD:-farahna_secure_password_2026}@postgres:5432/${DB_NAME:-farahna_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-farahna_super_secret_jwt_key_2026_egypt_weddings_production_grade}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      STORAGE_PATH: "/app/storage"
      DEFAULT_TIMEZONE: "Africa/Cairo"
    volumes:
      # Persistent Local Media Storage Volume (Protects files from container recreation)
      - media_storage:/app/storage
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - farahna_network

  # 3. Next.js Frontend Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-فرحنا — Farahna}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-201019262075}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-+201019262075}
    container_name: farahna_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - farahna_network

# Persistent Named Volumes
volumes:
  postgres_data:
    driver: local
  media_storage:
    driver: local

# Internal Network
networks:
  farahna_network:
    driver: bridge
