# =============================================================================
# Farahna Platform — Production Orchestration Stack (Nginx + API + Web + Postgres + Certbot)
# =============================================================================

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: farahna_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farahna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farahna_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-farahna_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farahna} -d ${POSTGRES_DB:-farahna_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farahna_network

  # 2. Express API Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: farahna_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-farahna}:${POSTGRES_PASSWORD:-farahna_secure_password_2026}@postgres:5432/${POSTGRES_DB:-farahna_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-farahna_super_secret_jwt_key_2026_egypt_weddings_production_grade}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://farahna.menuflowx.com}
      STORAGE_PATH: "/app/storage"
      DEFAULT_TIMEZONE: "${DEFAULT_TIMEZONE:-Africa/Cairo}"
    volumes:
      - media_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - farahna_network

  # 3. Next.js Frontend Web Service
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://farahna.menuflowx.com/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://farahna.menuflowx.com}
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-فرحنا — Farahna}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-201019262075}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-+201019262075}
    container_name: farahna_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - farahna_network

  # 4. Nginx Reverse Proxy & Static Caching Gateway
  nginx:
    image: nginx:1.27-alpine
    container_name: farahna_nginx
    restart: always
    ports:
      - "${HOST_HTTP_PORT:-9420}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - farahna_network

# Persistent Named Volumes (Data preservation across redeployments - isolated naming)
volumes:
  postgres_data:
    name: farahna_postgres_data
    driver: local
  media_storage:
    name: farahna_media_storage
    driver: local

# Internal Isolated Network (Guarantees zero interference with other host projects)
networks:
  farahna_network:
    name: farahna_network
    driver: bridge

