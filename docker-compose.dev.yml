# =============================================================================
# Farahna Platform — Development Docker Compose (Database Only or Full Dev)
# =============================================================================
version: '3.8'

services:
  # Standalone PostgreSQL for Local Node Development
  postgres:
    image: postgres:16-alpine
    container_name: farahna_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: farahna_db
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farahna_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
